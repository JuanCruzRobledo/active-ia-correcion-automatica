# ============================================
# Active-IA - Docker Compose (Desarrollo Local)
# ============================================
# Modo: Base de datos local en Docker
# Servicios: backend, frontend, n8n, postgres
# Uso: docker-compose -f docker-compose.local.yml up -d
# ============================================

version: '3.8'

services:
  # ==========================================
  # PostgreSQL (Base de datos local)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: active-ia-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-active_ia_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - active-ia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend (FastAPI)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: active-ia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:80"
    environment:
      # Base de datos local
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-active_ia_db}

      # Seguridad
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-chars!!}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}

      # N8N (URLs internas de Docker)
      N8N_WEBHOOK_BASE_URL: http://n8n:5678
      N8N_CORRECTION_WEBHOOK: ${N8N_CORRECTION_WEBHOOK:-/webhook/corregir-individual}
      N8N_RUBRIC_WEBHOOK: ${N8N_RUBRIC_WEBHOOK:-/webhook/rubrica}

      # Archivos
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-104857600}
      UPLOAD_PATH: /app/uploads
      BACKUP_PATH: /app/backups

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      NODE_ENV: development
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
      # Montaje de código para hot reload (opcional, comentar si no se necesita)
      # - ./backend:/app
    networks:
      - active-ia-network
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ==========================================
  # Frontend (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: active-ia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - active-ia-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==========================================
  # N8N (Workflows de IA)
  # ==========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: active-ia-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Autenticación
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin123}

      # Red
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}

      # Configuración
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Argentina/Buenos_Aires}
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-debug}

      # Persistencia de ejecuciones
      EXECUTIONS_DATA_PRUNE: true
      EXECUTIONS_DATA_MAX_AGE: 168  # 7 días
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - active-ia-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

# ==========================================
# Volúmenes persistentes
# ==========================================
volumes:
  postgres_data:
    name: active-ia_postgres_data
  backend_uploads:
    name: active-ia_backend_uploads
  backend_backups:
    name: active-ia_backend_backups
  n8n_data:
    name: active-ia_n8n_data

# ==========================================
# Red interna
# ==========================================
networks:
  active-ia-network:
    name: active-ia-network
    driver: bridge
