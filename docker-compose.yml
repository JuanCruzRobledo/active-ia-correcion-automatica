# ============================================
# Active-IA - Docker Compose (Producción/Híbrido)
# ============================================
# Modo: Base de datos en la nube
# Servicios: backend, frontend
# Uso: docker-compose up -d
# ============================================

version: '3.8'

services:
  # ==========================================
  # Backend (FastAPI)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: active-ia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:80"
    environment:
      # Base de datos (apunta a la nube)
      DATABASE_URL: ${DATABASE_URL}

      # Seguridad
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-7}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}

      # Archivos
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-[".zip",".txt"]}

      # Logging
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    networks:
      - active-ia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ==========================================
  # Frontend (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: active-ia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - active-ia-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# ==========================================
# Volúmenes persistentes
# ==========================================
volumes:
  backend_uploads:
    name: active-ia_backend_uploads
  backend_backups:
    name: active-ia_backend_backups

# ==========================================
# Red interna
# ==========================================
networks:
  active-ia-network:
    name: active-ia-network
    driver: bridge
