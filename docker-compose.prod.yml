# ============================================
# Active-IA - Docker Compose (Producción VPS)
# ============================================
# Modo: Producción completa en VPS
# Servicios: backend, frontend, n8n, postgres, nginx
# Uso: docker-compose -f docker-compose.prod.yml up -d
# ============================================

version: '3.8'

services:
  # ==========================================
  # PostgreSQL (Base de datos)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: active-ia-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Backup automático (opcional)
      - ./backups/postgres:/backups
    networks:
      - active-ia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No exponer puerto públicamente, solo dentro de Docker
    expose:
      - "5432"

  # ==========================================
  # Backend (FastAPI)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: active-ia-backend
    restart: always
    environment:
      # Base de datos local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Seguridad - IMPORTANTE: Usar valores fuertes del .env
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-7}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # CORS - Configurar con tu dominio
      CORS_ORIGINS: ${CORS_ORIGINS}

      # N8N (URLs internas de Docker)
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_CORRECCION: http://n8n:5678/webhook/corregir
      N8N_WEBHOOK_RUBRICA: http://n8n:5678/webhook/generar-rubrica
      N8N_WEBHOOK_HEALTH: http://n8n:5678/webhook/health
      N8N_TIMEOUT_SECONDS: 90

      # Archivos
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-[".zip",".txt"]}

      # Logging - Producción
      DEBUG: false
      LOG_LEVEL: INFO
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
      # NO montar código fuente en producción
    networks:
      - active-ia-network
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # No exponer puerto públicamente, solo a través de nginx
    expose:
      - "80"

  # ==========================================
  # Frontend (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL interna del backend a través de nginx
        VITE_API_URL: ${VITE_API_URL}
    container_name: active-ia-frontend
    restart: always
    networks:
      - active-ia-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # No exponer puerto públicamente, solo a través de nginx
    expose:
      - "80"

  # ==========================================
  # N8N (Workflows de IA)
  # ==========================================
  n8n:
    image: juancruzrobledo/n8n-active-ia:latest
    container_name: active-ia-n8n
    restart: always
    environment:
      # Autenticación - IMPORTANTE: Usar credenciales fuertes
      N8N_BASIC_AUTH_ACTIVE: true
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      # Red
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      WEBHOOK_URL: ${WEBHOOK_URL}

      # Configuración
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      N8N_LOG_LEVEL: info

      # Persistencia de ejecuciones
      EXECUTIONS_DATA_PRUNE: true
      EXECUTIONS_DATA_MAX_AGE: 168  # 7 días
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - active-ia-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # No exponer puerto públicamente, solo a través de nginx
    expose:
      - "5678"

  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: active-ia-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Logs
      - ./nginx/logs:/var/log/nginx
    networks:
      - active-ia-network
    depends_on:
      - frontend
      - backend
      - n8n
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# ==========================================
# Volúmenes persistentes
# ==========================================
volumes:
  postgres_data:
    name: active-ia_postgres_data
  backend_uploads:
    name: active-ia_backend_uploads
  backend_backups:
    name: active-ia_backend_backups
  n8n_data:
    name: active-ia_n8n_data

# ==========================================
# Red interna
# ==========================================
networks:
  active-ia-network:
    name: active-ia-network
    driver: bridge
