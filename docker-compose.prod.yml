# ============================================
# Active-IA - Docker Compose (Producción VPS)
# ============================================
# Modo: Producción completa en VPS
# Servicios: backend, frontend, postgres, nginx
# Uso: docker-compose -f docker-compose.prod.yml up -d
# ============================================

version: '3.8'

services:
  # ==========================================
  # PostgreSQL (Base de datos)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: active-ia-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Backup automático (opcional)
      - ./backups/postgres:/backups
    networks:
      - active-ia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No exponer puerto públicamente, solo dentro de Docker
    expose:
      - "5432"

  # ==========================================
  # Backend (FastAPI)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: active-ia-backend
    restart: always
    environment:
      # Base de datos local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Seguridad - IMPORTANTE: Usar valores fuertes del .env.
      # La sintaxis :? aborta `docker compose up` si la variable no esta
      # definida. Sin esto, compose inyectaria un string vacio y la app
      # arrancaria con una clave HS256 vacia (tan forjable como el default).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-7}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY requerido}

      # CORS - Configurar con tu dominio
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Archivos
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-[".zip",".txt"]}

      # Logging - Producción
      DEBUG: false
      LOG_LEVEL: INFO
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
      # NO montar código fuente en producción
    networks:
      - active-ia-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # No exponer puerto públicamente, solo a través de nginx
    expose:
      - "80"

  # ==========================================
  # Frontend (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL interna del backend a través de nginx
        VITE_API_URL: ${VITE_API_URL}
    container_name: active-ia-frontend
    restart: always
    networks:
      - active-ia-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # No exponer puerto públicamente, solo a través de nginx
    expose:
      - "80"

  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: active-ia-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Logs
      - ./nginx/logs:/var/log/nginx
    networks:
      - active-ia-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# ==========================================
# Volúmenes persistentes
# ==========================================
volumes:
  postgres_data:
    name: active-ia_postgres_data
  backend_uploads:
    name: active-ia_backend_uploads
  backend_backups:
    name: active-ia_backend_backups

# ==========================================
# Red interna
# ==========================================
networks:
  active-ia-network:
    name: active-ia-network
    driver: bridge
