<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexion - Active-IA</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfb;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --accent: #45b7d1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --fg: #fafafa;
          --muted: #9ca3af;
          --accent: #4ecdc4;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .logo {
        width: 88px;
        height: 88px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        min-height: 44px;
        padding: 0 1.25rem;
        border: none;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:hover {
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <svg class="logo" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="64" cy="64" r="64" fill="url(#g)" />
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FF6B6B" />
          <stop offset="50%" stop-color="#4ECDC4" />
          <stop offset="100%" stop-color="#45B7D1" />
        </linearGradient>
      </defs>
      <path d="M 45 85 L 55 55 L 64 35 L 73 55 L 83 85" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="51" y1="70" x2="77" y2="70" stroke="white" stroke-width="6" stroke-linecap="round" />
    </svg>
    <h1>Sin conexion</h1>
    <p>No pudimos conectarnos a Active-IA. Revisa tu conexion a internet e intenta de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </body>
</html>
