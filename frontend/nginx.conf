# ============================================
# Active-IA Frontend - Nginx Configuration
# ============================================

# Esquema real del cliente para reenviar al backend.
# Detras de un tunel HTTPS (cloudflared/ngrok) el TLS se termina afuera y a nginx
# le llega HTTP plano: $scheme = "http". Pero cloudflared SI manda el esquema
# original en X-Forwarded-Proto = "https". Si reenviaramos $scheme (http), FastAPI
# armaria los redirects 307 (slash final) con http:// → el navegador saltaria de
# https a http → cambio de origen → preflight CORS → 400. Usando el valor entrante
# (cuando existe) el backend arma el redirect en https, mismo origen, sin preflight.
# En local directo (localhost:3000) no hay header entrante → cae a $scheme (http). OK.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejorar performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;

    # Proxy de la API al backend: mismo origen que la app → sin CORS y accesible
    # desde cualquier host (red local, túnel HTTPS). 'backend' resuelve por la red
    # interna de Docker. proxy_buffering off + timeout largo para los endpoints SSE
    # (stream de snapshots, etc.).
    location /api/ {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        # $http_host (NO $host): preserva el puerto (localhost:3000) para que los
        # redirects 307 de FastAPI (slash final) apunten al host correcto y no a :80.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $fwd_proto (NO $scheme): respeta el esquema original del tunel HTTPS para
        # que los redirects 307 de FastAPI salgan en https (mismo origen, sin CORS).
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # Service worker y manifest: NUNCA cachear (si no, las actualizaciones de la PWA
    # no llegan al dispositivo). Exact match (=) gana sobre la regex de assets de abajo.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Cache de assets estáticos (JS, CSS, imágenes, fuentes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Routing: Todas las rutas devuelven index.html
    # Esto permite que React Router maneje el routing del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint (para Docker health check)
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Manejo de errores - redirigir a index.html (SPA)
    error_page 404 /index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
